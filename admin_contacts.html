<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Góp Ý | CineManager Admin</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #111; border-right: 1px solid var(--glass); padding: 2rem 0; display: flex; flex-direction: column; }
        .sidebar-logo { text-align: center; margin-bottom: 2rem; font-size: 1.8rem; font-weight: 800; color: var(--primary); text-transform: uppercase; }
        .sidebar-logo span { color: white; }
        .nav-item { padding: 1rem 2rem; color: var(--text-muted); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: var(--transition); border-left: 4px solid transparent; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: rgba(229, 9, 20, 0.1); color: white; border-left-color: var(--primary); }
        
        .main-content { flex: 1; padding: 2rem 3rem; background: var(--bg-dark); }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        
        .table-container { background: var(--card-bg); padding: 1.5rem; border-radius: 15px; border: 1px solid var(--glass); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; white-space: normal; }
        th, td { text-align: left; padding: 1rem; border-bottom: 1px solid var(--glass); font-size: 0.9rem; vertical-align: middle; }
        th { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        
        /* Cải thiện badge trạng thái đều, đẹp, không bị ngắt dòng */
        .badge-pending { 
            background: rgba(255, 193, 7, 0.15); 
            color: #ffc107; 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 600; 
            display: inline-block; 
            white-space: nowrap; 
            text-align: center;
        }
        .badge-resolved { 
            background: rgba(40, 167, 69, 0.15); 
            color: #28a745; 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 600; 
            display: inline-block; 
            white-space: nowrap; 
            text-align: center;
        }
        
        .btn-action { padding: 6px 14px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; white-space: nowrap; }
        .btn-action:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar Menu -->
        <div class="sidebar">
            <div class="sidebar-logo">Cine<span>Manager</span></div>
            <a href="dashboard.html" class="nav-item">📊 Thống kê doanh thu</a>
            <a href="admin_movies.html" class="nav-item">🎬 Quản lý Phim</a>
            <a href="showtimes.html" class="nav-item">📅 Quản lý Suất chiếu</a>
            <a href="admin_users.html" class="nav-item">👥 Quản lý Khách hàng</a>
            <a href="admin_contacts.html" class="nav-item active">📩 Quản lý Góp ý</a>
            <div style="margin-top: auto; padding: 0 2rem;">
                <button onclick="handleLogout()" style="width: 100%; background: #333;">🚪 Đăng xuất</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="page-header">
                <h2>📩 Hộp Thư Góp Ý & Liên Hệ Từ Khách Hàng</h2>
                <span id="display-username" style="color:var(--primary); font-weight:bold;"></span>
            </div>

            <div class="table-container">
                <h3>Danh sách yêu cầu hỗ trợ</h3>
                <table id="table-contacts">
                    <thead>
                        <tr>
                            <th>Khách hàng</th>
                            <th>Liên hệ</th>
                            <th>Chủ đề</th>
                            <th>Nội dung</th>
                            <th>Thời gian</th>
                            <th style="text-align: center;">Trạng thái</th>
                            <th style="text-align: center;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="assets/js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const authRes = await fetch('api/auth.php?action=check');
            const authData = await authRes.json();
            if (!authData.isLoggedIn || authData.role !== 'admin') {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('display-username').innerText = authData.username + ' (Admin)';
            loadContacts();
        });

        async function loadContacts() {
            try {
                const res = await fetch('api/admin_contacts.php?action=list');
                const contacts = await res.json();
                const tbody = document.querySelector('#table-contacts tbody');

                if (!Array.isArray(contacts) || contacts.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#888; padding: 2rem;">Chưa có thư góp ý nào từ khách hàng</td></tr>`;
                    return;
                }

                tbody.innerHTML = contacts.map(c => {
                    let timeStr = '';
                    if (c.created_at) {
                        const d = new Date(c.created_at);
                        timeStr = d.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) + ' - ' + d.toLocaleDateString('vi-VN');
                    }

                    const statusBadge = c.status === 'resolved' 
                        ? `<span class="badge-resolved">✔ Đã phản hồi</span>` 
                        : `<span class="badge-pending">⏳ Chưa xử lý</span>`;

                    const actionBtn = `<button class="btn-action" onclick="markResolved(${c.id})">Phản hồi</button>`;

                    return `
                        <tr>
                            <td style="font-weight: 600;">${c.full_name}</td>
                            <td>${c.email}<br><span style="color:var(--text-muted); font-size:0.8rem;">${c.phone || 'Không có'}</span></td>
                            <td style="color: var(--primary); font-weight: 600;">${c.subject}</td>
                            <td style="max-width: 250px; word-break: break-word;">
                                ${c.message}
                                ${c.admin_reply ? `<div style="margin-top:6px; font-size:0.85rem; color:#28a745; background: rgba(40,167,69,0.1); padding: 6px 10px; border-radius: 6px;"><strong>Phản hồi:</strong> ${c.admin_reply}</div>` : ''}
                            </td>
                            <td style="color: var(--text-muted); font-size: 0.85rem; white-space: nowrap;">${timeStr}</td>
                            <td style="text-align: center;">${statusBadge}</td>
                            <td style="text-align: center;">${actionBtn}</td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function markResolved(id) {
            const replyText = prompt("Nhập nội dung phản hồi gửi cho khách hàng:");
            if (replyText === null) return;

            try {
                const res = await fetch('api/admin_contacts.php?action=reply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, admin_reply: replyText })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Đã gửi phản hồi thành công!');
                    loadContacts();
                } else {
                    alert('Lỗi: ' + (data.error || 'Không thể gửi phản hồi'));
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
