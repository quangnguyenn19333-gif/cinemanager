<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Suất Chiếu | CineManager Admin</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        .admin-layout { display: flex; min-height: 100vh; }
        /* Sidebar Menu */
        .sidebar { width: 260px; background: #111; border-right: 1px solid var(--glass); padding: 2rem 0; display: flex; flex-direction: column; }
        .sidebar-logo { text-align: center; margin-bottom: 2rem; font-size: 1.8rem; font-weight: 800; color: var(--primary); text-transform: uppercase; }
        .sidebar-logo span { color: white; }
        .nav-item { padding: 1rem 2rem; color: var(--text-muted); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: var(--transition); border-left: 4px solid transparent; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: rgba(229, 9, 20, 0.1); color: white; border-left-color: var(--primary); }
        
        /* Main Content */
        .main-content { flex: 1; padding: 2rem 3rem; background: var(--bg-dark); }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        
        /* Compact Movie Selector Box */
        .movie-selector-container { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--glass); padding: 1.2rem; margin-bottom: 1.5rem; }
        .movie-selector-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: 1rem; flex-wrap: wrap; }
        .movie-search-input { flex: 1; padding: 0.7rem 1rem; background: #111; color: white; border: 1px solid var(--glass); border-radius: 8px; outline: none; font-size: 0.9rem; min-width: 180px; }
        
        /* Scrollable Movie Pills Grid */
        .movie-pills-scroll { max-height: 140px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 8px; padding-right: 5px; }
        .movie-pill { display: flex; align-items: center; gap: 8px; background: #1a1a1a; border: 1px solid var(--glass); padding: 6px 12px; border-radius: 20px; cursor: pointer; transition: 0.2s; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; }
        .movie-pill img { width: 24px; height: 32px; object-fit: cover; border-radius: 4px; }
        .movie-pill:hover { background: rgba(255,255,255,0.08); color: white; }
        .movie-pill.active { background: rgba(229, 9, 20, 0.2); border-color: var(--primary); color: white; }

        /* Custom Scrollbar cho gọn */
        .movie-pills-scroll::-webkit-scrollbar { width: 6px; }
        .movie-pills-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        /* Table Style */
        .table-container { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--glass); padding: 1.5rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 1rem; color: var(--text-muted); border-bottom: 1px solid var(--glass); font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .action-btn { padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .btn-delete { background: rgba(220, 53, 69, 0.2); color: #dc3545; }

        /* Modal CSS cơ bản */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal:not(.hidden) { display: flex; }
        .modal-content { background: #1a1a1a; padding: 2rem; border-radius: 12px; border: 1px solid var(--glass); width: 100%; max-width: 500px; position: relative; color: white; }
        .close-modal { position: absolute; top: 1rem; right: 1.2rem; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        .close-modal:hover { color: white; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #111; color: white; border: 1px solid var(--glass); border-radius: 8px; outline: none; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- MENU DỌC (Sidebar chuẩn 4 mục) -->
        <div class="sidebar">
            <div class="sidebar-logo">Cine<span>Manager</span></div>
            <a href="dashboard.html" class="nav-item">📊 Thống kê doanh thu</a>
            <a href="admin_movies.html" class="nav-item">🎬 Quản lý Phim</a>
            <a href="showtimes.html" class="nav-item active">📅 Quản lý Suất chiếu</a>
            <a href="admin_users.html" class="nav-item">👥 Quản lý Khách hàng</a>
            <div style="margin-top: auto; padding: 0 2rem;">
                <button onclick="handleLogout()" style="width: 100%; background: #333;">🚪 Đăng xuất</button>
            </div>
        </div>

        <!-- NỘI DUNG CHÍNH -->
        <div class="main-content">
            <div class="page-header">
                <h2>📅 Quản Lý Suất Chiếu Hệ Thống</h2>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <span id="display-username" style="color:var(--primary); font-weight:bold;"></span>
                    <button onclick="openModal('add-showtime-modal')" style="background: #28a745; border-radius: 8px; padding: 8px 16px; font-weight: 600; border: none; cursor: pointer; color: white;">➕ Thêm suất chiếu</button>
                    <button onclick="handleLogout()" style="background: rgba(220, 53, 69, 0.15); color: #ff5555; border: 1px solid rgba(220, 53, 69, 0.3); border-radius: 8px; transition: 0.3s; padding: 8px 16px; font-weight: 600; cursor: pointer;">🚪 Đăng xuất</button>
                </div>
            </div>

            <!-- BỘ LỌC TỔNG HỢP -->
            <div class="movie-selector-container">
                <div class="movie-selector-header" style="display: flex; gap: 12px; margin-bottom: 1rem; align-items: center; flex-wrap: nowrap;">
                    <span style="font-weight: 600; color: white; font-size: 0.95rem; white-space: nowrap;">🎯 Bộ lọc:</span>
                    
                    <!-- Dropdown lọc rạp -->
                    <select id="filter-cinema-select" style="padding: 0.7rem 1rem; background: #111; color: white; border: 1px solid var(--glass); border-radius: 8px; outline: none; width: 220px; flex-shrink: 0;">
                        <option value="all">📍 Tất cả cơ sở rạp</option>
                    </select>

                    <!-- Ô lọc theo ngày -->
                    <input type="date" id="filter-date-input" style="padding: 0.65rem 1rem; background: #111; color: white; border: 1px solid var(--glass); border-radius: 8px; outline: none; color-scheme: dark; width: 170px; flex-shrink: 0;" title="Lọc theo ngày chiếu">

                    <!-- Ô tìm kiếm phim -->
                    <input type="text" id="movie-filter-search" class="movie-search-input" placeholder="🔍 Tìm nhanh tên phim..." style="flex: 1; padding: 0.7rem 1rem; background: #111; color: white; border: 1px solid var(--glass); border-radius: 8px; outline: none;">
                </div>
                <div id="movie-pills-container" class="movie-pills-scroll">
                    <!-- Danh sách phim đổ bằng JS -->
                </div>
            </div>

            <!-- BẢNG SUẤT CHIẾU -->
            <div class="table-container">
                <h3 id="table-title" style="margin-bottom: 1rem; font-size: 1.1rem; color: white;">🕒 Danh sách toàn bộ suất chiếu</h3>
                <table>
                    <thead>
                        <tr>
                            <th>#ID</th>
                            <th>Phim</th>
                            <th>Ngày chiếu</th>
                            <th>Giờ chiếu</th>
                            <th>Phòng chiếu</th>
                            <th>Giá Thường</th>
                            <th>Giá VIP</th>
                            <th>Giá Couple</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="showtime-tbody">
                        <!-- Dữ liệu đổ bằng JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM SUẤT CHIẾU -->
    <div id="add-showtime-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('add-showtime-modal')">&times;</span>
            <h2>➕ Thêm Suất Chiếu Mới</h2>
            <form id="add-showtime-form" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label>Chọn Phim</label>
                    <select id="st-movie" required></select>
                </div>
                <div class="form-group">
                    <label>Chọn Phòng Chiếu</label>
                    <select id="st-room" required></select>
                </div>
                <div class="form-group">
                    <label>Ngày Chiếu</label>
                    <input type="date" id="st-date" required>
                </div>
                <div class="form-group">
                    <label>Giờ Chiếu</label>
                    <input type="time" id="st-time" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                    <div class="form-group"><label>Giá Thường</label><input type="number" id="st-price-std" value="90000"></div>
                    <div class="form-group"><label>Giá VIP</label><input type="number" id="st-price-vip" value="130000"></div>
                    <div class="form-group"><label>Giá Couple</label><input type="number" id="st-price-cp" value="220000"></div>
                </div>
                <button type="submit" style="width: 100%; background: #28a745; margin-top: 1rem; padding: 10px; border:none; border-radius:8px; font-weight:600; cursor:pointer; color:white;">Lưu Suất Chiếu</button>
            </form>
        </div>
    </div>

    <script src="assets/js/common.js"></script>
    <script>
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('hidden');
                modal.style.display = 'flex';
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('hidden');
                modal.style.display = 'none';
            }
        }

        let allMoviesForShowtimes = [];
        let selectedMovieId = null;
        let currentCinemaFilter = 'all'; // Khai báo biến lọc rạp tránh lỗi

        document.addEventListener('DOMContentLoaded', async () => {
            const authRes = await fetch('api/auth.php?action=check');
            const authData = await authRes.json();
            if (!authData.isLoggedIn || authData.role !== 'admin') {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('display-username').innerText = authData.username + ' (Admin)';

            // Tải dữ liệu ban đầu
            loadCinemasFilter();
            loadMoviesForSelector();
            loadShowtimes();

            // Lắng nghe sự kiện tìm kiếm phim
            document.getElementById('movie-filter-search').addEventListener('input', (e) => {
                renderMoviePills(e.target.value.toLowerCase().trim());
            });

            // Lắng nghe sự kiện lọc theo rạp
            document.getElementById('filter-cinema-select').addEventListener('change', (e) => {
                currentCinemaFilter = e.target.value;
                loadShowtimes(selectedMovieId);
            });

            // Lắng nghe sự kiện lọc theo ngày
            document.getElementById('filter-date-input').addEventListener('change', () => {
                loadShowtimes(selectedMovieId);
            });

            // Xử lý form thêm suất chiếu
            const addShowtimeForm = document.getElementById('add-showtime-form');
            if (addShowtimeForm) {
                addShowtimeForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const formData = {
                        movie_id: document.getElementById('st-movie').value,
                        room_id: document.getElementById('st-room').value,
                        show_date: document.getElementById('st-date').value,
                        show_time: document.getElementById('st-time').value,
                        price_standard: document.getElementById('st-price-std').value,
                        price_vip: document.getElementById('st-price-vip').value,
                        price_couple: document.getElementById('st-price-cp').value,
                    };
                    const res = await fetch('api/showtimes.php', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(formData)
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showToast(data.message || 'Thêm suất chiếu thành công');
                        addShowtimeForm.reset();
                        closeModal('add-showtime-modal');
                        loadShowtimes(selectedMovieId);
                    } else {
                        showToast(data.error || 'Có lỗi xảy ra', 'error');
                    }
                };
            }
        });

        // Hàm tải danh sách rạp vào ô lọc
        async function loadCinemasFilter() {
            try {
                const res = await fetch('api/cinemas.php');
                const cinemas = await res.json();
                const selectEl = document.getElementById('filter-cinema-select');
                if (!selectEl) return;

                let html = '<option value="all">📍 Tất cả cơ sở rạp</option>';
                cinemas.forEach(c => {
                    html += `<option value="${c.id}">${c.name}</option>`;
                });
                selectEl.innerHTML = html;
            } catch (err) {
                console.error("Lỗi tải danh sách rạp:", err);
            }
        }

        async function loadMoviesForSelector() {
            const res = await fetch('api/movies.php');
            allMoviesForShowtimes = await res.json();
            renderMoviePills('');
            
            const stMovie = document.getElementById('st-movie');
            if (stMovie) {
                stMovie.innerHTML = allMoviesForShowtimes.map(m => `<option value="${m.id}">${m.title}</option>`).join('');
            }

            const roomRes = await fetch('api/rooms.php');
            const rooms = await roomRes.json();
            const stRoom = document.getElementById('st-room');
            if (stRoom) {
                stRoom.innerHTML = rooms.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
            }
        }

        function renderMoviePills(keyword) {
            const container = document.getElementById('movie-pills-container');
            const filtered = allMoviesForShowtimes.filter(m => m.title.toLowerCase().includes(keyword));

            let html = `<div class="movie-pill ${selectedMovieId === null ? 'active' : ''}" onclick="filterShowtimes(null, 'Tất cả suất chiếu')">
                            <span>🌟 Tất cả suất chiếu</span>
                        </div>`;

            html += filtered.map(m => `
                <div class="movie-pill ${selectedMovieId == m.id ? 'active' : ''}" onclick="filterShowtimes(${m.id}, '${m.title.replace(/'/g, "\\'")}')">
                    <img src="${m.poster_url || 'https://via.placeholder.com/30'}" alt="">
                    <span>${m.title}</span>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        async function filterShowtimes(movieId, movieTitle) {
            selectedMovieId = movieId;
            renderMoviePills(document.getElementById('movie-filter-search').value.toLowerCase().trim());
            
            if (movieId === null) {
                document.getElementById('table-title').innerText = `🕒 Danh sách toàn bộ suất chiếu`;
                loadShowtimes();
            } else {
                document.getElementById('table-title').innerText = `🕒 Suất chiếu của phim: ${movieTitle}`;
                loadShowtimes(movieId);
            }
        }

        async function loadShowtimes(movieId = null) {
            let url = 'api/showtimes.php?all=1';
            if (movieId) {
                url += `&movie_id=${movieId}`;
            }
            const res = await fetch(url);
            let showtimes = await res.json();
            const tbody = document.getElementById('showtime-tbody');

            // Lọc theo cơ sở rạp
            if (currentCinemaFilter !== 'all') {
                showtimes = showtimes.filter(st => st.cinema_id == currentCinemaFilter);
            }

            // Lọc theo ngày chọn
            const selectedDate = document.getElementById('filter-date-input').value;
            if (selectedDate) {
                showtimes = showtimes.filter(st => st.show_date === selectedDate);
            }

            if (showtimes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding: 2rem; color: #888;">Chưa có suất chiếu nào được thiết lập</td></tr>`;
                return;
            }

            tbody.innerHTML = showtimes.map(st => `
                <tr>
                    <td style="color:var(--text-muted)">#${st.id}</td>
                    <td style="font-weight:bold; color:white;">${st.movie_title}</td>
                    <td>${st.show_date}</td>
                    <td style="color:var(--primary); font-weight:bold; font-size: 1.05rem;">${st.show_time}</td>
                    <td>${st.room_name}</td>
                    <td>${Number(st.price_standard).toLocaleString('vi-VN')} đ</td>
                    <td>${Number(st.price_vip).toLocaleString('vi-VN')} đ</td>
                    <td>${Number(st.price_couple).toLocaleString('vi-VN')} đ</td>
                    <td>
                        <button class="action-btn btn-delete" onclick="deleteShowtime(${st.id})">Xóa</button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteShowtime(id) {
            if (confirm('Bạn có chắc chắn muốn xóa suất chiếu này không?')) {
                const res = await fetch(`api/showtimes.php?id=${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast('Đã xóa suất chiếu thành công');
                    loadShowtimes(selectedMovieId);
                } else {
                    showToast('Lỗi khi xóa suất chiếu', 'error');
                }
            }
        }
    </script>
</body>
</html>
