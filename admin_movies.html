<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Phim | CineManager Admin</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/chatbot.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --primary-soft: #ff5c66;
            --bg-dark: #0c0d10;
            --card-bg: #16181f;
            --table-head: #1c1f29;
            --border-color: #262936;
            --row-border: #20232e;
            --text-main: #f5f5f5;
            --text-muted: #9ca3af;
            --gold: #f5b942;
            --mint: #34d399;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
        }

        .admin-layout { display: flex; min-height: 100vh; }

        /* Sidebar Menu */
        .sidebar {
            width: 260px;
            background: #0f1015;
            border-right: 1px solid var(--border-color);
            padding: 2rem 0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-logo {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-logo span { color: #fff; }

        .nav-item {
            padding: 1rem 2rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s ease;
            border-left: 4px solid transparent;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(229, 9, 20, 0.16) 0%, rgba(229, 9, 20, 0) 100%);
            color: #fff;
            border-left-color: var(--primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2rem 3rem;
            background: var(--bg-dark);
            min-width: 0;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h2 {
            margin: 0;
            font-size: 1.55rem;
            font-weight: 700;
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            background: var(--card-bg);
            padding: 1rem 1.25rem;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
            flex-wrap: wrap;
        }

        .filter-bar input,
        .filter-bar select {
            background: #1c1f29;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: 0.2s ease;
        }

        .filter-bar input:focus,
        .filter-bar select:focus {
            border-color: var(--primary-soft);
        }

        /* Table Style */
        .table-container {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            padding: 1.5rem;
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; }

        th {
            background: var(--table-head);
            text-align: left;
            padding: 0.95rem 1rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        td {
            padding: 0.95rem 1rem;
            border-bottom: 1px solid var(--row-border);
            vertical-align: middle;
            font-size: 0.9rem;
            transition: background-color 0.2s ease;
        }

        tbody tr:hover td { background: rgba(255, 255, 255, 0.03); }
        tbody tr:last-child td { border-bottom: none; }

        .action-btn {
            padding: 6px 11px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.82rem;
            margin-right: 6px;
            font-weight: 600;
            white-space: nowrap;
            transition: 0.2s ease;
        }

        .btn-edit {
            background: rgba(245, 185, 66, 0.14);
            color: var(--gold);
            border: 1px solid rgba(245, 185, 66, 0.35);
        }

        .btn-edit:hover {
            background: var(--gold);
            color: #0c0d10;
        }

        .btn-delete {
            background: rgba(229, 9, 20, 0.16);
            color: #ff6b74;
            border: 1px solid rgba(229, 9, 20, 0.42);
        }

        .btn-delete:hover {
            background: var(--primary);
            color: #fff;
        }

        /* Badge trạng thái chuẩn đẹp, chống rớt dòng */
        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 20px;
            text-align: center;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .status-badge.early {
            background: rgba(192, 132, 252, 0.15);
            color: #d8b4fe;
            border: 1px solid rgba(192, 132, 252, 0.35);
        }

        .status-badge.coming {
            background: rgba(245, 185, 66, 0.14);
            color: var(--gold);
            border: 1px solid rgba(245, 185, 66, 0.35);
        }

        .status-badge.showing {
            background: rgba(52, 211, 153, 0.14);
            color: var(--mint);
            border: 1px solid rgba(52, 211, 153, 0.35);
        }

        /* Modal CSS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal:not(.hidden) { display: flex; }

        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 500px;
            position: relative;
            color: #fff;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .close-modal:hover { color: #fff; }
        .form-group { margin-bottom: 1rem; }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: #1c1f29;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
        }

        .form-group input:focus { border-color: var(--primary-soft); }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- MENU DỌC -->
        <div class="sidebar">
            <div class="sidebar-logo">Cine<span>Manager</span></div>
            <a href="dashboard.html" class="nav-item">📊 Thống kê doanh thu</a>
            <a href="admin_movies.html" class="nav-item active">🎬 Quản lý Phim</a>
            <a href="showtimes.html" class="nav-item">📅 Quản lý Suất chiếu</a>
            <a href="admin_users.html" class="nav-item">👥 Quản lý Khách hàng</a>
            <a href="admin_contacts.html" class="nav-item">📩 Quản lý Góp ý</a>
            <a href="admin_applications.html" class="nav-item">💼 Quản lý tuyển dụng</a>
            <div style="margin-top: auto; padding: 0 2rem;">
                <button onclick="handleLogout()" style="width: 100%; background: #1e212b; color: #cbd5e1; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer;">🚪 Đăng xuất</button>
            </div>
        </div>

        <!-- NỘI DUNG CHÍNH -->
        <div class="main-content">
            <div class="page-header">
                <h2>🎬 Quản Lý Danh Sách Phim</h2>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <span id="display-username" style="color:var(--primary-soft); font-weight:bold;"></span>
                    <button onclick="openModal('add-movie-modal')" style="background: rgba(52, 211, 153, 0.16); color: var(--mint); border: 1px solid rgba(52, 211, 153, 0.38); border-radius: 8px; padding: 8px 16px; font-weight: 600; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='#34d399'; this.style.color='#0c0d10'" onmouseout="this.style.background='rgba(52, 211, 153, 0.16)'; this.style.color='#34d399'">➕ Thêm Phim Mới</button>
                    <button onclick="handleLogout()" style="background: rgba(229, 9, 20, 0.16); color: #ff6b74; border: 1px solid rgba(229, 9, 20, 0.42); border-radius: 8px; transition: 0.2s; padding: 8px 16px; font-weight: 600; cursor: pointer;" onmouseover="this.style.background='#e50914'; this.style.color='white'" onmouseout="this.style.background='rgba(229, 9, 20, 0.16)'; this.style.color='#ff6b74'">🚪 Đăng xuất</button>
                </div>
            </div>

            <!-- THANH TÌM KIẾM VÀ LỌC CỦA ADMIN -->
            <div class="filter-bar">
                <input type="text" id="admin-search" placeholder="🔍 Nhập tên phim hoặc thể loại..." style="flex: 1; min-width: 220px; padding: 0.8rem;">
                <select id="admin-status-filter" style="padding: 0.8rem; min-width: 200px;">
                    <option value="all">🌟 Tất cả trạng thái</option>
                    <option value="dang-chieu">🟢 Đang chiếu</option>
                    <option value="sap-chieu">🟡 Sắp chiếu</option>
                    <option value="suat-chieu-som">🟣 Suất chiếu sớm</option>
                </select>
            </div>

            <div class="table-container">
                <table id="admin-movies-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Poster</th>
                            <th>Tên Phim</th>
                            <th>Thể Loại</th>
                            <th>Thời lượng</th>
                            <th>Ngày phát hành</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="admin-movie-tbody">
                        <!-- Data đổ bằng JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM PHIM -->
    <div id="add-movie-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('add-movie-modal')">&times;</span>
            <h2>🎬 Thêm Phim Mới</h2>
            <form id="add-movie-form" style="margin-top: 1.5rem;">
                <div class="form-group"><label>Tên phim</label><input type="text" id="add-title" required></div>
                <div class="form-group"><label>Thể loại</label><input type="text" id="add-genre"></div>
                <div class="form-group"><label>Thời lượng (phút)</label><input type="number" id="add-duration"></div>
                <div class="form-group"><label>Ngày chiếu</label><input type="date" id="add-date"></div>
                <div class="form-group"><label>Poster URL</label><input type="url" id="add-poster"></div>
                <div class="form-group"><label>Trailer URL</label><input type="url" id="add-trailer"></div>
                <button type="submit" style="width: 100%; background: var(--mint); color: #0c0d10; padding: 10px; border:none; border-radius:8px; font-weight:700; cursor:pointer; margin-top:1rem;">Lưu Phim</button>
            </form>
        </div>
    </div>

    <!-- MODAL SỬA PHIM -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('edit-modal')">&times;</span>
            <h2>✏️ Chỉnh sửa phim</h2>
            <form id="edit-movie-form" style="margin-top: 1.5rem;">
                <input type="hidden" id="edit-id">
                <div class="form-group"><label>Tên phim</label><input type="text" id="edit-title" required></div>
                <div class="form-group"><label>Thể loại</label><input type="text" id="edit-genre"></div>
                <div class="form-group"><label>Thời lượng</label><input type="number" id="edit-duration"></div>
                <div class="form-group"><label>Ngày chiếu</label><input type="date" id="edit-date"></div>
                <div class="form-group"><label>Poster URL</label><input type="url" id="edit-poster"></div>
                <div class="form-group"><label>Trailer URL</label><input type="url" id="edit-trailer"></div>
                <button type="submit" style="width: 100%; background: var(--primary); padding: 10px; border:none; border-radius:8px; font-weight:700; cursor:pointer; color:white; margin-top:1rem;">Cập nhật thay đổi</button>
            </form>
        </div>
    </div>

    <script src="assets/js/common.js"></script>
    <script>
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('hidden');
                modal.style.display = 'flex';
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('hidden');
                modal.style.display = 'none';
            }
        }
    </script>
    <script src="assets/js/script.js?v=999"></script>
    <script src="assets/js/chatbot.js"></script>
</body>
</html>
